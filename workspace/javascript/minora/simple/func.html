<!-- 函数 -->
</body>
<script>
  function sum(a, b) {
    console.log(`计算两数之和: a = ${a}, b = ${b}`);
    return a + b;
  }

  console.log(sum(1, 2));
  
  // 匿名函数, 赋值给一个变量
  let add = (a, b) => {
    console.log(`计算两数之和: a = ${a}, b = ${b}`);
    return a + b;
  }
  console.log(add(3, 4));
</script>

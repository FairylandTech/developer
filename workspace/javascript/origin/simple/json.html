<script>
  let user = {
    name: "Julia",
    age: 19,
  }
  
  // 将对象转换为 JSON 字符串, 序列化
  console.log(JSON.stringify(user))
  
  let userString = "{\"name\":\"Julia\",\"age\":22}"
  // 将 JSON 字符串转换为对象, 反序列化
  let parseJSON = JSON.parse(userString)
  console.log(parseJSON, typeof parseJSON, parseJSON.name, parseJSON.age)
</script>

<body>
<!-- 变量和数据类型 -->
<!--
  数据类型
    1. number 数字类型, short/int/long/float/double/...
    2. string 字符串类型, 双引号/单引号/反引号(模板字符串)
    3. boolean 布尔类型， true/false
    4. undefined 未定义类型, 变量声明了但没有赋值，或者访问了对象不存在的属性
    5. null 空类型, 空对象，object类型
-->
</body>
<script>
  let name = "js";  // 变量声明
  const PI = 3.1415926; // 常量声明
  
  console.log(name, "数据类型", typeof name);
  console.log(PI, "数据类型", typeof PI);
</script>

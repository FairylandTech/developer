<!-- 自定义对象 -->

<script>
  let girl = {
    name: "Julia",
    age: 19,
    
    eat() {
      console.log(`${this.name} is eating...`);
      return null;
    }
  }
  
  console.log(girl.name, girl.age, girl.eat());

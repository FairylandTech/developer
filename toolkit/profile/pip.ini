# Windows 配置文件路径：%USERPROFILE%\AppData\Roaming\pip\pip.ini
# Linux/Mac 配置文件路径：~/.pip/pip.conf
# 优先级说明：本独立配置文件 > .condarc 中配置的pip参数，建议删除.condarc里的重复pip配置，统一用本文件管理避免冲突
[global]
# ======================================
# 🔧 基础行为配置
# ======================================
# 请求超时时间，和conda策略保持一致设5s，网络差可调整到10s，避免超时卡顿
timeout = 5
# 【推荐开启】禁用本地缓存：1. 避免旧缓存导致安装到过期版本 2. 节省磁盘空间 3. 需要离线装包时改为false，放开下面cache-dir配置
no-cache-dir = true
# # 【可选】缓存路径，开启缓存时指定到D盘，和conda缓存统一目录管理，避免占C盘空间
# cache-dir = D:\AppCache\pip-cache
# 【默认开启】SSL证书校验，避免源劫持风险，国内源偶发证书报错时可临时改为false
ssl_verify = true

# ======================================
# 📦 源配置（和conda策略统一：国内清华源优先 + 官方源兜底）
# ======================================
# 默认主源：清华pypi镜像，下载速度是官方源的10~100倍
index-url = https://pypi.tuna.tsinghua.edu.cn/simple
# 兜底源：官方pypi，国内源找不到包/超时自动切到这里
extra-index-url = https://pypi.org/simple
# 信任的源地址，避免报"untrusted host"错误
trusted-host =
    pypi.tuna.tsinghua.edu.cn
    pypi.org

# ======================================
# ✨ 可选实用配置
# ======================================
# user = false  # 安装包默认写入用户目录，不需要管理员权限，平时用conda虚拟环境的话不需要开，直接装到虚拟环境即可
# upgrade-strategy = only-if-needed  # 升级依赖时仅升级必要版本，避免盲目升级导致依赖冲突

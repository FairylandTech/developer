# TYPE  DATABASE        USER            ADDRESS                 METHOD

# 容器内本地 socket（初始化脚本、pg_isready、backup.sh 使用）
local   all             all                                     trust

# 容器内回环
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# 宿主机经端口映射进来的连接，源地址是 Docker 网桥（默认 172.16.0.0/12），
# 而不是 127.0.0.1；同一 compose 网络内的其它容器也在此网段
host    all             all             172.16.0.0/12           scram-sha-256

# 公网客户端白名单：只放行具体 IP（/32），不要用 0.0.0.0/0
# 客户端公网 IP 变化后需同步修改，然后 SELECT pg_reload_conf();
host    all             all             75.37.238.81/32         scram-sha-256
host    all             all             0.0.0.0/0               scram-sha-256

# 内网访问（按实际网段收窄；需要时取消注释）
# host  all             all             10.0.0.0/8              scram-sha-256
# host  all             all             192.168.0.0/16          scram-sha-256

# 复制连接（加从库时按从库地址开启）
# host  replication     all             10.0.0.0/8              scram-sha-256

# =====================================================================
# PostgreSQL 17 优化配置（基准：2C / 1G 容器 / SSD，与 .env 资源限制对应）
# 调整机器规格时请参考 README 中的公式同步修改
# =====================================================================

#------------------------------------------------------------------
# 连接
#------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 50                    # 高并发建议前置 PgBouncer，而不是无限调大
superuser_reserved_connections = 3
password_encryption = scram-sha-256

tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6
idle_in_transaction_session_timeout = 10min   # 防止长事务阻塞 vacuum
# statement_timeout = 60s               # 按业务需要开启

#------------------------------------------------------------------
# 内存
#------------------------------------------------------------------
shared_buffers = 256MB                  # RAM * 25%
effective_cache_size = 768MB            # RAM * 75%（仅用于优化器估算）
work_mem = 4MB                          # (RAM - shared_buffers) / (max_connections * 3) 左右；大查询可单独 SET
maintenance_work_mem = 64MB             # RAM * 5%~10%，上限 2GB
autovacuum_work_mem = 32MB              # 每个 autovacuum worker 各占一份
huge_pages = try
temp_buffers = 8MB

#------------------------------------------------------------------
# WAL / Checkpoint
#------------------------------------------------------------------
wal_level = replica                     # 支持流复制 & PITR
wal_buffers = 16MB                      # 上限即 16MB（一个 WAL 段），更大无收益
wal_compression = lz4
min_wal_size = 512MB
max_wal_size = 2GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_writer_delay = 200ms
synchronous_commit = on                 # 可容忍丢失最近几百 ms 数据时改为 off 可大幅提升写入
full_page_writes = on

# 复制（单机可保留，便于后续加从库）
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 512MB
hot_standby = on

# 归档（需要 PITR 时开启）
archive_mode = off
# archive_command = 'test ! -f /backup/wal/%f && cp %p /backup/wal/%f'

#------------------------------------------------------------------
# 磁盘 / 优化器（SSD）
#------------------------------------------------------------------
random_page_cost = 1.1                  # SSD 1.1，HDD 改为 4
seq_page_cost = 1.0
effective_io_concurrency = 200          # SSD 200，HDD 改为 2
maintenance_io_concurrency = 200        # SSD 200，HDD 改为 10
default_statistics_target = 100
jit = off                               # OLTP 短查询关闭 JIT 更稳定；分析型负载可开启

#------------------------------------------------------------------
# 并行
#------------------------------------------------------------------
max_worker_processes = 8                # 后台 worker 总池，需容纳并行 worker + 逻辑复制等，留余量
max_parallel_workers = 2                # = CPU 核数
max_parallel_workers_per_gather = 1     # CPU 核数 / 2
max_parallel_maintenance_workers = 1    # CPU 核数 / 2

#------------------------------------------------------------------
# Autovacuum
#------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_insert_scale_factor = 0.1
autovacuum_vacuum_cost_limit = 2000     # SSD 上让 vacuum 跑得更快
autovacuum_vacuum_cost_delay = 2ms

#------------------------------------------------------------------
# 日志
#------------------------------------------------------------------
logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 0                   # 文件名按天，按大小轮转会追加回同一文件、实际无效，故关闭
log_truncate_on_rotation = off
log_file_mode = 0640

log_line_prefix = '%m [%p] %q%u@%d %r app=%a '
log_min_duration_statement = 1000       # 记录 >1s 的慢查询
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 64MB
log_autovacuum_min_duration = 10s
log_statement = 'ddl'

#------------------------------------------------------------------
# 统计 / 扩展
#------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_io_timing = on
track_functions = pl
track_activity_query_size = 4096

#------------------------------------------------------------------
# 本地化
#------------------------------------------------------------------
# timezone / log_timezone 由 docker-compose.yml 的 command 按 .env 中 TZ 传入
datestyle = 'iso, ymd'
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'
default_text_search_config = 'pg_catalog.simple'
